<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F17">
<title>Tavo POS</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
/* ============================================================
   Tavo POS — Design System v1.0
   Modern Professional Restaurant POS UI
   RTL + LTR · Dark (default) + Light · Desktop/Tablet/Mobile
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --brand:#FF6A2B; --brand-2:#FB8C4D; --brand-soft:rgba(255,106,43,.14); --brand-ring:rgba(255,106,43,.28);
  --bg:#0B0F17; --surface:#131824; --surface-2:#1A2030; --surface-3:#232B3E; --border:#232B3E; --border-2:#2F3A52;
  --txt:#F1F5F9; --txt-2:#CBD5E1; --mut:#94A3B8; --mut-2:#64748B;
  --green:#22C55E; --green-soft:rgba(34,197,94,.15);
  --amber:#F59E0B; --amber-soft:rgba(245,158,11,.15);
  --red:#EF4444;   --red-soft:rgba(239,68,68,.15);
  --blue:#3B82F6;  --blue-soft:rgba(59,130,246,.15);
  --purple:#A855F7;--purple-soft:rgba(168,85,247,.15);
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:999px;
  --sh-xs:0 1px 2px rgba(0,0,0,.28);
  --sh-sm:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.22);
  --sh-md:0 6px 18px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.22);
  --sh-lg:0 20px 48px rgba(0,0,0,.5);
  --sidebar-w:244px; --sidebar-w-collapsed:68px; --header-h:64px;
  --ease:cubic-bezier(.2,.7,.3,1);
  --dur-fast:120ms; --dur:180ms; --dur-slow:240ms;
  --focus:0 0 0 3px var(--brand-ring);
}
[data-theme="light"]{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#FAFBFC; --surface-3:#F1F3F7;
  --border:#E5E7EB; --border-2:#D1D5DB;
  --txt:#0F172A; --txt-2:#475569; --mut:#64748B; --mut-2:#94A3B8;
  --sh-xs:0 1px 2px rgba(15,23,42,.04);
  --sh-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 6px 18px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 20px 48px rgba(15,23,42,.14);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Cairo','Tajawal',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:transparent}
input,select,textarea{font-family:inherit}
h1,h2,h3,h4,h5,h6,p{margin:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border-2)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}

/* ---------- Layout shell ---------- */
#app{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--header-h) 1fr;
  grid-template-areas:"sidebar header" "sidebar main";
  height:100vh; width:100vw;
  transition:grid-template-columns var(--dur) var(--ease);
}
#app.is-collapsed{grid-template-columns:var(--sidebar-w-collapsed) 1fr}

.sidebar{
  grid-area:sidebar; background:var(--surface);
  border-inline-end:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
.sidebar__brand{
  display:flex; align-items:center; gap:10px;
  height:var(--header-h); padding:0 14px;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.sidebar__brand-text{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sidebar__brand-name{font-weight:800;font-size:15px;letter-spacing:.2px}
.sidebar__brand-sub{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar__toggle{
  margin-inline-start:auto; width:30px; height:30px; border-radius:8px;
  display:grid; place-items:center; color:var(--mut); font-size:16px;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.sidebar__toggle:hover{background:var(--surface-3); color:var(--txt)}

.nav{flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 10px 16px; display:flex; flex-direction:column; gap:2px}
.nav-section{margin-top:14px}
.nav-section:first-child{margin-top:0}
.nav-section-label{
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--mut-2); padding:6px 10px 4px; user-select:none;
}
.navbtn{
  position:relative; display:flex; align-items:center; gap:12px;
  width:100%; height:40px; padding:0 10px;
  border-radius:var(--r-sm); color:var(--mut); font-size:13.5px; font-weight:500;
  text-align:start;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.navbtn .ic{font-size:17px; flex-shrink:0; width:22px; text-align:center; line-height:1}
.navbtn:hover{background:var(--surface-3); color:var(--txt)}
.navbtn.active{background:var(--brand-soft); color:var(--brand); font-weight:700}
.navbtn.active::before{
  content:""; position:absolute; inset-inline-start:-10px; top:8px; bottom:8px;
  width:3px; border-radius:0 3px 3px 0; background:var(--brand);
}
html[dir="ltr"] .navbtn.active::before{border-radius:3px 0 0 3px}
#app.is-collapsed .sidebar__brand-text,
#app.is-collapsed .sidebar__toggle,
#app.is-collapsed .nav-section-label,
#app.is-collapsed .navbtn > span:not(.ic){display:none}
#app.is-collapsed .navbtn{justify-content:center; padding:0}
#app.is-collapsed .sidebar__brand{justify-content:center;padding:0}

.topbar{
  grid-area:header; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:0 18px; min-width:0;
}
.topbar__title{display:flex;flex-direction:column;min-width:0}
.topbar__title h1{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__title .sub{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{
  background:var(--surface-2); border:1px solid var(--border);
  padding:5px 10px; border-radius:var(--r-full);
  font-size:12px; color:var(--txt-2); white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px;
  transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.pill b{color:var(--txt); font-weight:700}
.pill:hover{border-color:var(--border-2)}
.modebadge{
  font-size:11px; padding:4px 10px; border-radius:var(--r-full);
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--mut); white-space:nowrap; max-width:220px;
  overflow:hidden; text-overflow:ellipsis;
}
.user-chip{
  display:flex; align-items:center; gap:8px;
  height:34px; padding:0 12px 0 6px;
  border-radius:var(--r-full);
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--txt); font-size:12.5px; font-weight:600;
  transition:border-color var(--dur-fast) var(--ease);
}
.user-chip:hover{border-color:var(--brand); color:var(--brand)}
.user-chip__av{
  width:24px; height:24px; border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff; display:grid; place-items:center; font-size:11px; font-weight:800;
}
.mobile-menu-btn{
  display:none; width:38px; height:38px; border-radius:10px;
  background:var(--surface-2); border:1px solid var(--border);
  font-size:17px; color:var(--txt);
}

.view{
  grid-area:main; padding:20px; overflow:auto; min-width:0;
  animation:viewIn var(--dur) var(--ease);
}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cards / KPI ---------- */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:16px; box-shadow:var(--sh-xs);
}
.card h4{margin:0 0 4px; font-size:12.5px; color:var(--mut); font-weight:600; letter-spacing:.02em}
.card .val{font-size:26px; font-weight:800; letter-spacing:-.02em}
.delta{font-size:12px; margin-top:4px; color:var(--mut)}
.up{color:var(--green)}
.grid{display:grid; gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec-title{
  font-size:12px; font-weight:700; color:var(--mut);
  text-transform:uppercase; letter-spacing:.06em; margin:4px 0 12px;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:42px; padding:0 16px;
  border-radius:var(--r-md);
  background:var(--surface-2); color:var(--txt);
  border:1px solid var(--border);
  font-size:14px; font-weight:700; text-align:center;
  transition:background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  user-select:none; white-space:nowrap;
}
.btn:hover{background:var(--surface-3); border-color:var(--border-2)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-2); border-color:var(--brand-2); box-shadow:0 8px 22px -10px var(--brand)}
.btn.green{background:var(--green); border-color:var(--green); color:#062a1c}
.btn.green:hover{filter:brightness(1.05)}
.btn.danger{background:var(--red); border-color:var(--red); color:#fff}
.btn.ghost{background:transparent; border-color:var(--border); color:var(--txt)}
.btn.ghost:hover{background:var(--surface-2)}
.btn--icon{min-width:42px; padding:0; flex:0}
.btn--sm{min-height:32px; padding:0 12px; font-size:12.5px; border-radius:var(--r-sm)}

/* ---------- Chip / Tag ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 12px; border-radius:var(--r-full);
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--txt-2); font-size:12.5px; font-weight:600;
  transition:background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.chip:hover{border-color:var(--border-2); color:var(--txt)}
.chip:active{transform:scale(.96)}
.chip.sel{background:var(--brand); border-color:var(--brand); color:#fff}
.chip.sel:hover{background:var(--brand-2); border-color:var(--brand-2)}
.tag{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 9px; border-radius:var(--r-full);
  font-size:11px; font-weight:700; letter-spacing:.02em;
  background:var(--surface-2); color:var(--mut); border:1px solid transparent;
}
.tag.green{background:var(--green-soft); color:var(--green)}
.tag.amber{background:var(--amber-soft); color:var(--amber)}
.tag.red{background:var(--red-soft); color:var(--red)}
.tag.blue{background:var(--blue-soft); color:var(--blue)}

/* ---------- Inputs ---------- */
.fld{margin-bottom:14px}
.fld label{display:block; font-size:12px; color:var(--mut); margin-bottom:6px; font-weight:600}
.fld input,.fld select,.fld textarea{
  width:100%; padding:10px 12px;
  border-radius:var(--r-sm);
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--txt); font-size:14px;
  transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none; border-color:var(--brand); background:var(--surface); box-shadow:var(--focus);
}

/* ---------- Tables ---------- */
table{width:100%; border-collapse:separate; border-spacing:0; font-size:13px}
th{
  text-align:start; color:var(--mut); font-weight:600;
  padding:10px 12px; border-bottom:1px solid var(--border);
  font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
  background:var(--surface);
}
td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:none}

/* ---------- POS ---------- */
.pos{display:grid; grid-template-columns:1fr minmax(340px,400px); gap:16px; height:100%}
.menuwrap{display:flex; flex-direction:column; min-height:0; gap:12px}
.cats{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; flex-shrink:0; scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  padding:8px 16px; border-radius:var(--r-full);
  background:var(--surface); border:1px solid var(--border);
  font-size:13px; font-weight:600; white-space:nowrap; color:var(--txt-2);
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.cat:hover{border-color:var(--border-2); color:var(--txt)}
.cat.active{background:var(--brand); border-color:var(--brand); color:#fff}
.items{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px; overflow:auto; align-content:start; padding-bottom:4px;
}
.item{
  position:relative;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:14px;
  min-height:118px; display:flex; flex-direction:column; justify-content:space-between;
  text-align:start; color:var(--txt);
  transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  overflow:hidden;
}
.item:hover{border-color:var(--brand); transform:translateY(-2px); box-shadow:var(--sh-sm)}
.item:active{transform:scale(.97)}
.item .emoji{font-size:26px; line-height:1}
.item .nm{font-size:13px; font-weight:600; margin-top:8px; line-height:1.3}
.item .pr{color:var(--brand); font-weight:700; font-size:14px; margin-top:4px}
.item:disabled{opacity:.45; cursor:not-allowed}
.check{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); display:flex; flex-direction:column;
  min-height:0; box-shadow:var(--sh-sm);
}
.check .hd{
  padding:14px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.check .hd h3{margin:0; font-size:15px; font-weight:700}
.check .lines{flex:1; overflow:auto; padding:6px 8px}
.empty{color:var(--mut); text-align:center; padding:36px 16px; font-size:13px; line-height:1.7}
.line{
  display:flex; gap:10px; padding:10px 8px;
  border-radius:var(--r-sm); align-items:flex-start;
  transition:background var(--dur-fast) var(--ease);
  animation:lineIn var(--dur) var(--ease) backwards;
}
@keyframes lineIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.line:hover{background:var(--surface-2)}
.line .qty{
  background:var(--surface-3); border:1px solid var(--border);
  border-radius:var(--r-sm); min-width:28px; height:28px;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:12.5px; flex-shrink:0;
}
.line .info{flex:1; min-width:0}
.line .info .ln-nm{font-size:13px; font-weight:600}
.line .info .ln-mod{font-size:11px; color:var(--mut); margin-top:2px; line-height:1.4}
.line .ln-pr{font-weight:700; font-size:13px}
.line .rm{color:var(--red); font-size:15px; padding:4px 6px; border-radius:6px; transition:background var(--dur-fast) var(--ease)}
.line .rm:hover{background:var(--red-soft)}
.totals{padding:14px 16px; border-top:1px solid var(--border); font-size:13px}
.totrow{display:flex; justify-content:space-between; padding:3px 0; color:var(--mut)}
.totrow.big{color:var(--txt); font-weight:800; font-size:19px; padding-top:10px; border-top:1px dashed var(--border); margin-top:8px}
.actions{padding:12px; display:flex; gap:8px}
.actions .btn{flex:1}

/* ---------- Floor / Tables ---------- */
.floor{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px}
.tbl{
  aspect-ratio:1; border-radius:var(--r-md);
  border:1.5px solid var(--border); background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; font-weight:700; color:var(--txt); padding:12px;
  transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.tbl:hover{border-color:var(--brand); transform:translateY(-3px); box-shadow:var(--sh-md)}
.tbl.seated{border-color:var(--green); background:var(--green-soft)}
.tbl .tnum{font-size:22px; font-weight:800}
.tbl .tst{font-size:11px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.seats{font-size:11px; color:var(--mut)}

/* ---------- KDS ---------- */
.kds{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; align-items:start}
.ticket{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); overflow:hidden; box-shadow:var(--sh-xs);
  animation:viewIn var(--dur) var(--ease);
}
.ticket .thd{
  padding:12px 14px; background:var(--surface-2);
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--border);
}
.ticket .thd .num{font-weight:800; font-size:14px}
.ticket .tbody{padding:10px 14px; font-size:13px}
.ticket .tbody .it{padding:7px 0; border-bottom:1px dashed var(--border); font-weight:600}
.ticket .tbody .it:last-child{border:none}
.ticket .tbody .mods{color:var(--amber); font-size:11px; margin-inline-start:14px; font-weight:500; margin-top:2px}
.ticket .tfoot{padding:10px 14px; border-top:1px solid var(--border); background:var(--surface-2)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55);
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.overlay.show{display:flex; animation:fadeBg var(--dur) var(--ease)}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); width:100%; max-width:460px;
  box-shadow:var(--sh-lg); max-height:90vh; overflow:auto;
  animation:modalIn var(--dur-slow) var(--ease);
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.mhd{
  padding:16px 20px; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  position:sticky; top:0; background:var(--surface); z-index:1;
}
.mhd h3{margin:0; font-size:16px; font-weight:700; flex:1; min-width:0}
.mbd{padding:20px}
.x{
  background:var(--surface-2); border:1px solid var(--border);
  width:30px; height:30px; border-radius:8px;
  font-size:16px; color:var(--mut); flex-shrink:0;
  display:grid; place-items:center;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.x:hover{background:var(--surface-3); color:var(--txt)}
.modrow{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 16px}

/* ---------- Tips / Payment ---------- */
.tips{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0 16px}
.tipbtn{
  padding:14px 8px; border-radius:var(--r-md);
  background:var(--surface-2); border:1.5px solid var(--border);
  text-align:center; color:var(--txt);
  transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.tipbtn:hover{border-color:var(--border-2)}
.tipbtn .p{font-size:17px; font-weight:800}
.tipbtn .a{font-size:11.5px; color:var(--mut)}
.tipbtn.sel{border-color:var(--green); background:var(--green-soft)}
.paymethods{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:12px 0}
.pm{
  padding:14px 10px; border-radius:var(--r-md);
  background:var(--surface-2); border:1.5px solid var(--border);
  text-align:center; font-weight:700; font-size:13px; color:var(--txt);
  transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.pm .ic{font-size:22px; display:block; margin-bottom:6px}
.pm:hover{border-color:var(--border-2)}
.pm.sel{border-color:var(--brand); background:var(--brand-soft)}

/* ---------- Receipt ---------- */
.receipt{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:12.5px; background:#fff; color:#111;
  border-radius:var(--r-md); padding:20px;
  direction:ltr; text-align:left; line-height:1.5;
}
.receipt hr{border:none; border-top:1px dashed #999; margin:8px 0}
.receipt .r{display:flex; justify-content:space-between; gap:8px}
.receipt .c{text-align:center}

/* ---------- Progress bar ---------- */
.bar{height:8px; background:var(--surface-3); border-radius:6px; overflow:hidden; margin-top:6px}
.bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:6px; transition:width var(--dur) var(--ease)}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%) translateY(140%);
  background:var(--surface); color:var(--txt);
  padding:13px 22px; border-radius:var(--r-full);
  font-weight:700; font-size:13.5px;
  box-shadow:var(--sh-lg);
  border:1px solid var(--border);
  transition:transform var(--dur-slow) var(--ease);
  z-index:99; max-width:min(480px,90vw); text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast--success{border-inline-start-color:var(--green)}
.toast--warning{border-inline-start-color:var(--amber)}
.toast--danger {border-inline-start-color:var(--red)}

/* ---------- QR ---------- */
.qrgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px}

/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block; position:absolute; left:0; top:0; width:280px; color:#000; direction:ltr; text-align:left;
    font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:12px; padding:6px}
  #printArea hr{border:none; border-top:1px dashed #000; margin:6px 0}
  #printArea .r{display:flex; justify-content:space-between}
  #printArea .c{text-align:center}
  @page{margin:6mm}
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .pos{grid-template-columns:1fr 360px}
  .items{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
}
@media (max-width:1024px){
  #app{grid-template-columns:1fr; grid-template-areas:"header" "main"}
  .sidebar{
    position:fixed; inset-block:0; inset-inline-start:0; width:280px;
    z-index:60; transform:translateX(110%);
    transition:transform var(--dur) var(--ease);
    box-shadow:var(--sh-lg);
    border-inline-end:1px solid var(--border);
  }
  html[dir="rtl"] .sidebar{transform:translateX(110%)}
  html[dir="ltr"] .sidebar{transform:translateX(-110%)}
  #app.mobile-nav-open .sidebar{transform:translateX(0)}
  .sidebar__toggle{display:none}
  .mobile-menu-btn{display:grid; place-items:center}
  .view{padding:16px}
}
@media (max-width:900px){
  .pos{grid-template-columns:1fr; grid-template-rows:auto auto; height:auto}
  .check{max-height:70vh}
  .items{max-height:45vh}
  .topbar{padding:0 12px; gap:8px}
  .topbar__title h1{font-size:14px}
  .modebadge{display:none}
}
@media (max-width:600px){
  body{overflow:auto}
  #app{height:auto; min-height:100vh}
  .view{padding:12px}
  .topbar{min-height:56px; height:auto; padding:8px 10px; flex-wrap:wrap}
  .topbar .spacer{display:none}
  .user-chip span:not(.user-chip__av){display:none}
  .user-chip{padding:4px}
  .pill{padding:4px 8px; font-size:11px}
  .items{grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
  .item{padding:10px; min-height:96px; border-radius:10px}
  .item .emoji{font-size:22px}
  .item .nm{font-size:12px; margin-top:6px}
  .item .pr{font-size:12.5px}
  .kpis{grid-template-columns:repeat(2,1fr); gap:10px}
  .card{padding:12px; border-radius:10px}
  .card .val{font-size:20px}
  .row2{grid-template-columns:1fr}
  .tips{grid-template-columns:repeat(4,1fr); gap:6px}
  .tipbtn{padding:10px 4px}
  .paymethods{grid-template-columns:1fr; gap:6px}
  .pm{display:flex; align-items:center; gap:10px; padding:12px 14px; text-align:start}
  .pm .ic{margin:0; font-size:20px}
  .actions{flex-wrap:wrap}
  .modal{border-radius:var(--r-md)}
  .mhd{padding:12px 14px}
  .mbd{padding:14px}
  th,td{padding:8px 8px; font-size:12px}
  .floor{grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px}
  .kds{grid-template-columns:1fr; gap:10px}
  .navbtn{height:44px}
}
@media (max-width:400px){
  .items{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
  .kpis{grid-template-columns:1fr}
}

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="logo" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0">T</div>

</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toastEl"></div>
<div id="printArea"></div>

<script>
// قاعدة الـ API: نفس الأصل على الويب؛ الخادم المستضاف عند التشغيل كتطبيق أصلي (Capacitor).
const BACKEND_URL = 'https://app.tavopoint.com';
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
  || location.protocol === 'capacitor:' || location.protocol === 'file:';
const API = IS_NATIVE ? BACKEND_URL : '';
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n).toFixed(2);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = localStorage.getItem('pp_token') || null;
let ME = null;

/* ===== محرك العمل دون اتصال ===== */
let ONLINE = true;
let OUTBOX  = JSON.parse(localStorage.getItem('pp_outbox')  || '[]');
let PENDING = JSON.parse(localStorage.getItem('pp_pending') || '[]');
const saveOutbox  = () => { localStorage.setItem('pp_outbox',  JSON.stringify(OUTBOX));  updateConn(); };
const savePending = () => { localStorage.setItem('pp_pending', JSON.stringify(PENDING)); };
class OfflineError extends Error { constructor(m){ super(m); this.offline = true; } }
const isGet = o => !o.method || o.method === 'GET';
const cacheSet = (p,d) => { try{ localStorage.setItem('pp_cache_'+p, JSON.stringify(d)); }catch{} };
const cacheGet = p => { try{ const v=localStorage.getItem('pp_cache_'+p); return v?JSON.parse(v):null; }catch{ return null; } };

async function api(path, opts={}){
  const headers = {'Content-Type':'application/json', ...(opts.headers||{})};
  if(TOKEN) headers.Authorization = 'Bearer '+TOKEN;
  let r;
  try {
    r = await fetch(API+'/api'+path, {...opts, headers});
  } catch(e){
    goOffline();
    if(isGet(opts)){ const c = cacheGet(path); if(c !== null) return c; }
    throw new OfflineError('offline');
  }
  if(!ONLINE) goOnline();
  if(r.status===401){ logout(true); throw new Error('يرجى تسجيل الدخول'); }
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
  const data = r.status===204 ? null : await r.json();
  if(isGet(opts)) cacheSet(path, data);
  return data;
}

let _pollIv = null;
function goOffline(){ if(ONLINE){ ONLINE=false; updateConn(); toast('📴 دون اتصال — سيتم اصطفاف الطلبات'); startPoll(); } }
function goOnline(){ if(!ONLINE){ ONLINE=true; updateConn(); stopPoll(); toast('🟢 عاد الاتصال — جارٍ المزامنة'); flushOutbox(); } }
function startPoll(){ if(_pollIv) return; _pollIv=setInterval(async()=>{ try{ const r=await fetch(API+'/api/health'); if(r.ok) goOnline(); }catch{} }, 5000); }
function stopPoll(){ if(_pollIv){ clearInterval(_pollIv); _pollIv=null; } }

// === MODIFIED: ألوان وحالة الاتصال ===
function updateConn(){
  const el=document.getElementById('connpill'); if(!el) return;
  const n=OUTBOX.length;
  el.innerHTML = ONLINE ? (n?`🟢 متصل · مزامنة ${n}`:'🟢 متصل') : `📴 دون اتصال${n?` · ${n} بالانتظار`:''}`;
  el.style.color = ONLINE ? 'var(--green)' : 'var(--amber)';
  el.style.borderColor = ONLINE ? 'var(--border)' : 'rgba(245,158,11,.35)';
}
window.addEventListener('online',  ()=>goOnline());
window.addEventListener('offline', ()=>goOffline());

let _flushing=false;
async function flushOutbox(){
  if(_flushing || !ONLINE || !OUTBOX.length){ updateConn(); return; }
  _flushing=true;
  try{
    while(OUTBOX.length){
      const op=OUTBOX[0];
      if(op.type==='order'){
        const order=await api('/orders',{method:'POST',body:JSON.stringify(op.payload)});
        await api('/orders/'+order.id+'/fire',{method:'POST'});
        PENDING=PENDING.filter(p=>p.tempId!==op.tempId); savePending();
      } else if(op.type==='payment'){
        await api('/payments/complete',{method:'POST',body:JSON.stringify({
          intentId:'offline_'+(op.tempId||Date.now()), method:op.payload.method,
          lines:op.payload.lines, tip:op.payload.tip, table:op.payload.table, orderId:op.payload.orderId||null })});
      }
      OUTBOX.shift(); saveOutbox();
    }
    toast('✅ تمت مزامنة كل العناصر بالانتظار');
    if(['kds','floor','dash'].includes(route)) render();
  } catch(e){
  } finally { _flushing=false; updateConn(); }
}

let CFG = {paymentMode:'mock', taxRate:0.0825, publishableKey:null};
let MENU = [], CATS = [], activeCat = '', check = [], tableNo = null, route='pos';
let checkCustomer = null;
let LOYALTY = { earnRate: 1, redeemRate: 0.05 };
let TENANT_MODE = 'restaurant';
let TENANT_SETTINGS = {};
const isRetail = () => TENANT_MODE === 'retail';
let posSearch = '';
function availableNow(it, now){ now=now||new Date(); const s=it&&it.schedule;
  if(!s||(!s.start&&!s.end&&(!Array.isArray(s.days)||!s.days.length))) return true;
  if(Array.isArray(s.days)&&s.days.length&&!s.days.includes(now.getDay())) return false;
  if(s.start||s.end){ const mins=now.getHours()*60+now.getMinutes();
    const toM=t=>{const p=String(t).split(':');return (Number(p[0])||0)*60+(Number(p[1])||0);};
    const a=s.start?toM(s.start):0,b=s.end?toM(s.end):1440;
    if(a<=b){ if(mins<a||mins>=b) return false; } else if(mins<a&&mins>=b) return false; }
  return true; }
const MODIFIERS = ["بدون بصل","جبن إضافي (+$1.50)","إضافة لحم مقدد (+$2)","خالٍ من الغلوتين (+$2)","حار","مطبوخ جيدًا","على الجانب"];

// === MODIFIED: NAV بأقسام ===
const NAV_SECTIONS = [
  { label: '',            items: ['pos','floor','reservations','kds'] },
  { label: 'الطلبات',     items: ['online','qr'] },
  { label: 'التقارير',    items: ['dash','analytics','locations'] },
  { label: 'الإدارة',     items: ['menu','inventory','purchasing','stocktake','discounts'] },
  { label: 'العملاء',     items: ['loyalty','crm','houseaccounts','marketing'] },
  { label: 'العمليات',    items: ['drawer','clock','team'] },
  { label: 'ذكاء',        items: ['ask'] },
  { label: 'النظام',      items: ['settings'] }
];
const NAV_ITEMS = {
  pos:{ic:'🧾',label:'الطلب'},           floor:{ic:'🍽️',label:'الطاولات'},
  reservations:{ic:'📅',label:'الحجوزات'}, kds:{ic:'👨‍🍳',label:'المطبخ'},
  online:{ic:'📲',label:'إلكتروني'},     qr:{ic:'🔳',label:'QR'},
  dash:{ic:'📊',label:'التقارير'},        analytics:{ic:'📈',label:'التحليلات'},
  locations:{ic:'🏢',label:'الفروع'},     menu:{ic:'📖',label:'القائمة'},
  inventory:{ic:'📦',label:'المخزون'},    purchasing:{ic:'🚚',label:'المشتريات'},
  stocktake:{ic:'🔢',label:'الجرد'},      loyalty:{ic:'💳',label:'الولاء'},
  discounts:{ic:'🏷️',label:'الخصومات'},  crm:{ic:'👥',label:'العملاء'},
  houseaccounts:{ic:'🏛️',label:'الشركات'}, marketing:{ic:'📣',label:'التسويق'},
  drawer:{ic:'💵',label:'درج النقدية'},   clock:{ic:'⏱️',label:'سجل الدوام'},
  ask:{ic:'✨',label:'اسأل Tavo'},        team:{ic:'🧑‍🤝‍🧑',label:'الفريق'},
  settings:{ic:'⚙️',label:'الإعدادات'}
};
const titles = Object.fromEntries(Object.entries(NAV_ITEMS).map(([k,v])=>[k,[v.label,'']]));
titles.pos=["الطلب","أنشئ فاتورة"];
titles.floor=["الطاولات","مخطط الصالة"];
titles.reservations=["الحجوزات","الحجوزات وقائمة الانتظار"];
titles.kds=["شاشة المطبخ","التذاكر النشطة"];
titles.online=["الطلبات الإلكترونية","DoorDash · Uber Eats · Grubhub"];
titles.qr=["طلب ودفع QR","أكواد المسح للطلب"];
titles.dash=["التقارير","الأداء"];
titles.analytics=["التحليلات","التفاصيل والاتجاهات"];
titles.locations=["الفروع","مجموع الفروع المتعددة"];
titles.menu=["إدارة القائمة","العناصر والأسعار"];
titles.inventory=["المخزون","الأرصدة وتكلفة الوصفات"];
titles.purchasing=["المشتريات","الموردون وأوامر الشراء"];
titles.stocktake=["الجرد","الجرد الدوري والتسويات"];
titles.loyalty=["الولاء وبطاقات الهدايا","الأعضاء والمكافآت"];
titles.discounts=["الخصومات","الإعدادات المسبقة والساعة السعيدة"];
titles.crm=["العملاء","الملفات والسجل"];
titles.houseaccounts=["حسابات الشركات","حسابات الدين والفواتير"];
titles.marketing=["التسويق","حملات البريد والرسائل"];
titles.drawer=["درج النقدية","فتح وتسوية وإغلاق"];
titles.clock=["سجل الدوام","تسجيل الحضور والانصراف"];
titles.ask=["اسأل Tavo","مساعدك الذكي للأعمال"];
titles.team=["الفريق","الموظفون"];
titles.settings=["الإعدادات","التهيئة"];

const PLATFORM_META={doordash:{name:'DoorDash',color:'#ff3008',emoji:'🚗'},ubereats:{name:'Uber Eats',color:'#06c167',emoji:'🛵'},grubhub:{name:'Grubhub',color:'#f63440',emoji:'🍔'},other:{name:'إلكتروني',color:'#4d8df5',emoji:'📲'},qr:{name:'QR طاولة',color:'#a855f7',emoji:'📱'}};
function chMeta(o){ return o.channel==='delivery'?(PLATFORM_META[o.platform]||PLATFORM_META.other):(o.channel==='qr'?PLATFORM_META.qr:null); }

// === MODIFIED: toast بدعم variants ===
function toast(m, kind){
  const t=$("#toastEl");
  t.textContent=m;
  t.classList.remove('toast--success','toast--warning','toast--danger');
  if(kind) t.classList.add('toast--'+kind);
  else if(/^✅|^💰|^💳|^🟢|^✓/.test(m)) t.classList.add('toast--success');
  else if(/^⚠️|^📴/.test(m)) t.classList.add('toast--warning');
  else if(/^✕|^❌/.test(m)) t.classList.add('toast--danger');
  t.classList.add("show"); clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("show"),2400);
}

// === MODIFIED: Modal مع Escape ===
function openModal(h){
  $("#modal").innerHTML=h;
  $("#overlay").classList.add("show");
  document.addEventListener('keydown',_escClose);
}
function closeModal(){
  $("#overlay").classList.remove("show");
  document.removeEventListener('keydown',_escClose);
}
function _escClose(e){ if(e.key==='Escape') closeModal(); }
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});

// === NEW: Sidebar / Mobile nav ===
function toggleSidebar(){
  const app=document.getElementById('app');
  app.classList.toggle('is-collapsed');
  try{ localStorage.setItem('pp_sidebar_collapsed', app.classList.contains('is-collapsed')?'1':'0'); }catch(e){}
}
function toggleMobileNav(){
  document.getElementById('app').classList.toggle('mobile-nav-open');
}
(function(){
  try{ if(localStorage.getItem('pp_sidebar_collapsed')==='1')
    document.addEventListener('DOMContentLoaded',()=>document.getElementById('app').classList.add('is-collapsed'));
  }catch(e){}
})();

function totals(lines){let sub=0,taxFull=0;const dft=CFG.taxRate||0;
  for(const l of lines){const m=(l.mods||[]).reduce((s,x)=>{const z=String(x).match(/\+\$([0-9.]+)/);return s+(z?+z[1]:0)},0);
    const ls=(l.price+m)*l.qty; sub+=ls; const r=(l.taxRate!=null&&l.taxRate!=='')?Number(l.taxRate):dft; taxFull+=ls*r;}
  const effRate=sub>0?taxFull/sub:dft; return{sub,tax:taxFull,total:sub+taxFull,effRate}}

// === MODIFIED: allowedNav / renderNav ===
function allowedNav(){
  const r = (ME&&ME.routes)||[];
  const retailMap = { pos:{ic:'🛒',label:'بيع'}, menu:{ic:'🏷️',label:'المنتجات'}, inventory:{ic:'📦',label:'المخزون'} };
  const hideRetail = new Set(['floor','kds','qr','online','reservations']);
  const visible = id => r.includes(id) && (!isRetail() || !hideRetail.has(id));
  return NAV_SECTIONS
    .map(sec => ({
      label: sec.label,
      items: sec.items.filter(visible).map(id => {
        const base = NAV_ITEMS[id];
        const override = isRetail() ? retailMap[id] : null;
        return { id, ic:(override&&override.ic)||base.ic, label:(override&&override.label)||base.label };
      })
    }))
    .filter(sec => sec.items.length);
}
function renderNav(){
  const sections = allowedNav();
  $("#nav").innerHTML = sections.map(sec => `
    ${sec.label ? `<div class="nav-section"><div class="nav-section-label">${sec.label}</div>` : '<div class="nav-section">'}
    ${sec.items.map(n=>`<button class="navbtn ${route===n.id?'active':''}" onclick="go('${n.id}')" title="${n.label}"><span class="ic">${n.ic}</span><span>${n.label}</span></button>`).join('')}
    </div>`).join('');
  const tn=document.getElementById('tenantName');
  if(tn) tn.textContent=(ME&&ME.tenantName)||'Tavo';
  const un=document.getElementById('userName'), ua=document.getElementById('userAv');
  if(un) un.textContent=(ME&&ME.name)||'—';
  if(ua) ua.textContent=((ME&&ME.name)||'T').charAt(0).toUpperCase();
}

// === MODIFIED: go يغلق mobile nav ===
function go(r){
  if(!((ME&&ME.routes)||[]).includes(r)){toast('غير مسموح لدورك');return}
  route=r;renderNav();render();
  const app=document.getElementById('app');
  if(app.classList.contains('mobile-nav-open')) app.classList.remove('mobile-nav-open');
}

async function render(){
  const retailTitles={pos:["بيع","إتمام عملية بيع"],menu:["المنتجات","الكتالوج والأسعار"],inventory:["المخزون","المتاح وإعادة الطلب"]};
  const ttl=(isRetail()&&retailTitles[route])||titles[route];
  $("#vtitle").textContent=ttl[0];$("#vsub").textContent=ttl[1];
  const v=$("#view");
  if(route==="pos")v.innerHTML=posView();
  else if(route==="floor")v.innerHTML=await floorView();
  else if(route==="reservations")v.innerHTML=await reservationsView();
  else if(route==="kds")v.innerHTML=await kdsView();

let _mp=null;
function openModifierPicker(it,lineIndex){
  const sel={}; (it.modifierGroups||[]).forEach(g=>sel[g.id]=new Set());
  if(lineIndex!=null && check[lineIndex]){
    const have=(check[lineIndex].mods||[]).map(m=>m.replace(/\s*\(\+\$[0-9.]+\)$/,''));
    (it.modifierGroups||[]).forEach(g=>g.options.forEach(o=>{ if(have.includes(o.name)) sel[g.id].add(o.name); }));
  }
  _mp={it,lineIndex,sel}; renderModifierPicker();
}
function toggleOpt(gid,name){
  const g=_mp.it.modifierGroups.find(x=>x.id===gid); const s=_mp.sel[gid]; const single=(g.max||0)===1;
  if(single){ s.clear(); s.add(name); }
  else if(s.has(name)) s.delete(name);
  else { if(g.max && s.size>=g.max){ toast('حتى '+g.max+' لـ '+g.name); return; } s.add(name); }
  renderModifierPicker();
}
function _mpExtra(){ let e=0; _mp.it.modifierGroups.forEach(g=>g.options.forEach(o=>{ if(_mp.sel[g.id].has(o.name)) e+=o.price||0; })); return e; }
function renderModifierPicker(){
  const it=_mp.it;
  const groups=it.modifierGroups.map(g=>{const s=_mp.sel[g.id];
    const tag=g.required?'<span class="tag red" style="font-size:10px">إلزامي</span>'
      :`<span class="tag" style="font-size:10px">اختياري${g.max?` · حتى ${g.max}`:''}</span>`;
    const opts=g.options.map(o=>`<button class="chip ${s.has(o.name)?'sel':''}" onclick="toggleOpt('${g.id}','${(o.name||'').replace(/'/g,"\\'")}')">${o.name}${o.price?` +$${(o.price).toFixed(2)}`:''}</button>`).join('');
    return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:13px">${g.name}</b>${tag}</div><div class="modrow" style="margin:0">${opts}</div></div>`;
  }).join('');
  openModal(`<div class="mhd"><h3>${it.emoji||''} ${it.name}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="mbd">${groups}<button class="btn primary" onclick="commitMods()">${_mp.lineIndex!=null?'تحديث':'إضافة'} · ${money(it.price+_mpExtra())}</button></div>`);
}
function commitMods(){
  for(const g of _mp.it.modifierGroups){ const n=_mp.sel[g.id].size;
    if(g.required && n<(g.min||1)){ toast('اختر '+(g.min||1)+' لـ '+g.name); return; }
    if(g.min && n<g.min){ toast('اختر على الأقل '+g.min+' لـ '+g.name); return; } }
  const mods=[]; _mp.it.modifierGroups.forEach(g=>g.options.forEach(o=>{ if(_mp.sel[g.id].has(o.name)) mods.push(o.price?`${o.name} (+$${o.price.toFixed(2)})`:o.name); }));
  if(_mp.lineIndex!=null && check[_mp.lineIndex]) check[_mp.lineIndex].mods=mods;
  else check.push({id:_mp.it.id,name:_mp.it.name,price:_mp.it.price,qty:1,mods,taxRate:_mp.it.taxRate??null,seat:activeSeat||null});
  _mp=null; closeModal(); render();
}

    }catch(e){ if(!e.offline){ toast('⚠️ '+e.message); return; } }

}
function queueOrder(payload){
  const tempId='tmp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const number='P'+String(PENDING.length+1).padStart(2,'0');

}

let pay={};
async function startPayment(){
  const t=totals(check);
  pay={lines:JSON.parse(JSON.stringify(check)),table:tableNo,sub:t.sub,effRate:t.effRate,tip:0,tipPct:0,method:'cash',
    customer:checkCustomer, pointsRedeemed:0, redeemDiscount:0, manualDiscount:0, discountReason:'', comp:false,
    serviceCharge:0, svcPct:0, taxExempt:false, giftApplied:0, giftCode:null};
  const sc=Number((TENANT_SETTINGS||{}).serviceChargePct)||0;
  if(sc>0){ pay.svcPct=sc; pay.serviceCharge=Math.round(pay.sub*sc)/100; }
  try{
    const act=await api('/discounts/active?subtotal='+pay.sub).catch(()=>[]);
    if(act&&act.length&&!(pay.manualDiscount>0)){
      const d=act[1];
      const amt=d.amount!=null?d.amount:(d.kind==='amount'?Number(d.value):pay.sub*Number(d.value)/100);
      pay.manualDiscount=Math.round(Math.min(pay.sub,Math.max(0,amt))*100)/100;
      pay.discountReason=d.reason||d.name; pay.comp=false; pay.autoDisc=true;
    }
  }catch(e){}
  paymentModal();
}
function payCalc(){
  const sub=pay.sub;
  const disc=Math.round(Math.min(sub,(pay.redeemDiscount||0)+(pay.manualDiscount||0))*100)/100;
  const taxable=Math.round((sub-disc)*100)/100;
  const svc=Math.round((pay.serviceCharge||0)*100)/100;
  const tax=pay.taxExempt?0:Math.round(taxable*(pay.effRate!=null?pay.effRate:(CFG.taxRate||0))*100)/100;
  const tip=Math.round((pay.tip||0)*100)/100;
  const total=Math.round((taxable+svc+tax+tip)*100)/100;
  const gift=Math.min(pay.giftApplied||0,total);
  const due=Math.round(Math.max(0,total-gift)*100)/100;
  return {sub,disc,svc,tax,tip,total,gift,due};
}

let _lastPayId=null, _lastPayCustomer=null;
function receiptInner(p,calc,grand,when){
  const c=calc||{sub:p.sub||0,disc:0,svc:0,tax:0,tip:p.tip||0,total:grand,gift:0,due:grand};
  const items=p.lines.map(l=>`<div class="r"><span>${l.qty}× ${l.name}</span><span>${money(l.price*l.qty)}</span></div>${(l.mods&&l.mods.length)?`<div style="color:#777;font-size:11px;margin-left:14px">${l.mods.join(", ")}</div>`:""}`).join("");
  return `<div class="c"><b>TAVO</b><br>123 Main St · (555) 010-2233</div><hr>
    <div class="r"><span>${when}</span></div>${p.table?`<div class="r"><span>طاولة</span><span>${p.table}</span></div>`:`<div class="r"><span>سفري</span><span></span></div>`}<hr>
    ${items}<hr><div class="r"><span>المجموع الفرعي</span><span>${money(c.sub)}</span></div>
    ${c.disc>0?`<div class="r"><span>خصم${p.discountReason?(' ('+p.discountReason+')'):''}</span><span>−${money(c.disc)}</span></div>`:''}
    ${c.svc>0?`<div class="r"><span>رسم الخدمة</span><span>${money(c.svc)}</span></div>`:''}
    <div class="r"><span>الضريبة</span><span>${money(c.tax)}</span></div><div class="r"><span>البقشيش</span><span>${money(c.tip)}</span></div>
    <div class="r"><b>الإجمالي</b><b>${money(c.total)}</b></div>
    ${c.gift>0?`<div class="r"><span>بطاقة هدايا</span><span>−${money(c.gift)}</span></div>`:''}
    <div class="r"><span>مدفوع (${p.method})</span><span>${money(grand)}</span></div><hr>
    <div class="c">شكرًا لك! 🙏</div>`;
}
function showReceipt(grand){
  const when=new Date().toLocaleString();
  const calc=payCalc();
  _lastReceipt={pay:JSON.parse(JSON.stringify(pay)),calc,grand,when};
  openModal(`<div class="mhd"><h3>✅ تمت الموافقة على الدفع</h3><button class="x" onclick="closeModal();render()">✕</button></div>
    <div class="mbd"><div class="receipt">${receiptInner(pay,calc,grand,when)}</div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn ghost" onclick="printReceipt()">🖨 طباعة</button>
      <button class="btn ghost" onclick="digitalReceiptForm()">📲 إيصال رقمي</button>
      <button class="btn primary" onclick="closeModal();render()">تم</button></div></div>`);
  if(localStorage.getItem('pp_autoprint_receipt')==='1') setTimeout(printReceipt,150);
  try{ pushDisplay({message:'شكرًا لك!'}); }catch(e){}
  toast('💰 تم خصم '+money(grand));
}
function digitalReceiptForm(){
  if(!_lastPayId){ toast('لا يوجد دفع لإرساله'); return; }
  const ip='width:100%;padding:9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt)';
  const c=_lastPayCustomer||{};

    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="chip active" id="dr-email-btn" onclick="_drCh='email';dr_paint()">✉️ بريد</button>
      <button class="chip" id="dr-sms-btn" onclick="_drCh='sms';dr_paint()">💬 رسالة</button></div>
    <div class="fld"><label id="dr-label">عنوان البريد</label><input id="dr-to" value="${esc(c.email||'')}" placeholder="name@example.com" style="${ip}" autofocus></div>
    <button class="btn green" style="margin-top:6px" onclick="sendDigitalReceipt()">إرسال الإيصال</button></div>`);

let _drCh='email';
function dr_paint(){
  const c=_lastPayCustomer||{};
  document.getElementById('dr-label').textContent=_drCh==='email'?'عنوان البريد':'رقم الهاتف';
  const to=document.getElementById('dr-to'); to.placeholder=_drCh==='email'?'name@example.com':'555-123-4567'; to.value=_drCh==='email'?(c.email||''):(c.phone||'');
  document.getElementById('dr-email-btn').classList.toggle('active',_drCh==='email');
  document.getElementById('dr-sms-btn').classList.toggle('active',_drCh==='sms');

async function sendDigitalReceipt(){
  const to=document.getElementById('dr-to').value.trim();
  if(!to){ toast('أدخل '+(_drCh==='email'?'بريدًا':'هاتفًا')); return; }
  try{ await api('/receipts/send',{method:'POST',body:JSON.stringify({paymentId:_lastPayId,channel:_drCh,to})});
    closeModal(); render(); toast(_drCh==='email'?'✉️ أُرسل الإيصال بالبريد':'💬 أُرسل الإيصال برسالة'); }
  catch(e){ toast('⚠️ '+e.message); }
}
function doPrint(html){ const pa=document.getElementById('printArea'); pa.innerHTML=html; window.print(); }
function printReceipt(){
  if(!_lastReceipt) return;
  doPrint(receiptInner(_lastReceipt.pay,_lastReceipt.calc,_lastReceipt.grand,_lastReceipt.when));
}
function emailReceipt(){
  if(!_lastReceipt) return;
  const p=_lastReceipt.pay,g=_lastReceipt.grand,c=_lastReceipt.calc||{};
  const lines=p.lines.map(l=>`${l.qty}x ${l.name}  ${money(l.price*l.qty)}`).join('%0D%0A');
  const body=`Tavo Receipt%0D%0A${_lastReceipt.when}%0D%0A%0D%0A${lines}%0D%0A%0D%0ASubtotal ${money(c.sub||p.sub)}${c.disc>0?('%0D%0ADiscount -'+money(c.disc)):''}${c.svc>0?('%0D%0AService charge '+money(c.svc)):''}%0D%0ATax ${money(c.tax||0)}%0D%0ATip ${money(c.tip||p.tip)}%0D%0ATOTAL ${money(c.total||g)}%0D%0APaid (${p.method})%0D%0A%0D%0AThank you!`;
  window.location.href=`mailto:?subject=Your%20Tavo%20Receipt&body=${body}`;
  toast('✉️ جارٍ فتح البريد…');
}

/* ---- شاشة المطبخ ---- */
function kdsBody(o){
  const line=it=>`<div class="it">${it.qty}× ${it.name}${it.seat?` <span style="font-size:11px;color:#7fb3ff">👤${it.seat}</span>`:''}${(it.mods&&it.mods.length)?`<div class="mods">↳ ${it.mods.join(", ")}</div>`:""}</div>`;
  const courses=[...new Set((o.lines||[]).map(l=>l.course).filter(Boolean))].sort();
  if(!courses.length) return (o.lines||[]).map(line).join("");
  const fired=o.firedCourses||[];
  const noCourse=(o.lines||[]).filter(l=>!l.course);
  const courseLabel={'1':'دورة 1 · مقبلات','2':'دورة 2 · أطباق رئيسية','3':'دورة 3 · حلوى'};
  let html=courses.map(c=>{
    const ls=(o.lines||[]).filter(l=>l.course===c); const isFired=fired.includes(c);
    return `<div style="border-top:1px dashed var(--border);padding-top:6px;margin-top:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);margin-bottom:2px">
        <b>${courseLabel[c]||('دورة '+c)}</b>
        ${isFired?'<span class="tag green" style="padding:1px 6px">أُطلقت</span>':(o._local?'':`<button class="chip" style="padding:2px 8px" onclick="fireCourse('${o.id}','${c}')">🔥 أطلق</button>`)}</div>
      ${ls.map(line).join("")}</div>`;
  }).join("");
  if(noCourse.length) html+=`<div style="margin-top:6px">${noCourse.map(line).join("")}</div>`;
  return html;
}

async function bump(id,local){
  if(local){ PENDING=PENDING.filter(p=>p.tempId!==id); savePending(); render(); toast('تم إنهاء التذكرة المصطفّة'); return; }
  try{ await api('/orders/'+id+'/bump',{method:'POST'}); render(); toast('التذكرة جاهزة'); }
  catch(e){ toast(e.offline?'📴 دون اتصال — حاول عند عودة الاتصال':'⚠️ '+e.message); }
}
async function voidOrder(id,num,local){
  if(!confirm('إلغاء الطلب #'+num+'؟ سيُلغى قبل الدفع.'))return;
  if(local){ OUTBOX=OUTBOX.filter(op=>op.tempId!==id); saveOutbox();
    PENDING=PENDING.filter(p=>p.tempId!==id); savePending(); render(); toast('تم إلغاء الطلب المصطفّ'); return; }
  try{await api('/orders/'+id+'/void',{method:'POST',body:JSON.stringify({reason:'إلغاء الموظف'})});render();toast('تم إلغاء الطلب #'+num);}
  catch(e){toast(e.offline?'📴 الإلغاء يحتاج اتصالًا':'⚠️ '+e.message)}
}

function guestSlug(){ return (ME&&ME.tenantSlug) || (typeof TENANT_SLUG!=='undefined'&&TENANT_SLUG) || 'default'; }
function guestBase(){ return (IS_NATIVE?BACKEND_URL:location.origin); }
function guestUrl(table){ const s=guestSlug(); let u=guestBase()+'/order.html?tenant='+encodeURIComponent(s); if(table!=null) u+='&table='+encodeURIComponent(table); return u; }
function kioskUrl(){ return guestBase()+'/order.html?tenant='+encodeURIComponent(guestSlug())+'&kiosk=1'; }
function launchKiosk(){ const w=window.open(kioskUrl(),'_blank'); if(!w){toast('اسمح بالنوافذ المنبثقة لتشغيل الكشك');} }
function displayUrl(){ return guestBase()+'/display.html?tenant='+encodeURIComponent(guestSlug()); }
function launchDisplay(){ const w=window.open(displayUrl(),'_blank'); if(!w){toast('اسمح بالنوافذ المنبثقة لفتح الشاشة');} }
let _dispSig='';
function pushDisplay(opts){
  if(!ONLINE) return;
  const t=totals(check);
  const lines=check.map(l=>({name:l.name,qty:l.qty,price:l.price}));
  const payload=opts&&opts.message!=null
    ? {lines:[],subtotal:0,tax:0,total:0,message:opts.message}
    : {lines,subtotal:t.sub,tax:t.tax,total:t.total,message:null};
  const sig=JSON.stringify(payload);
  if(sig===_dispSig) return; _dispSig=sig;
  api('/display',{method:'POST',body:JSON.stringify(payload)}).catch(()=>{});
}
let _cc=null;
let _ccTimer=null, _ccCharging=false, _ccReceiptDone=false, _ccPayId=null;
async function startCustomerCheckout(){
  if(!check.length) return;
  if(!ONLINE){ toast('دفع العميل يحتاج اتصالًا'); return; }
  const t=totals(check);
  const lines=check.map(l=>({name:l.name,qty:l.qty,price:l.price}));
  try{
    _cc=await api('/display/checkout',{method:'POST',body:JSON.stringify({lines,subtotal:t.sub,tax:t.tax,total:t.total,tipPresets:[0.18,0.20,0.25]})});
    _ccCharging=false; _ccReceiptDone=false; _ccPayId=null;
    ccModal('📲 أُرسل إلى شاشة العميل','الضيف يختار البقشيش ويدفع…');
    clearInterval(_ccTimer); _ccTimer=setInterval(pollCustomerCheckout,1100); pollCustomerCheckout();
  }catch(e){ toast('⚠️ '+e.message); }
}
function ccModal(title,body,done){
  openModal(`<div class="mhd"><h3>${title}</h3><button class="x" onclick="cancelCustomerCheckout()">✕</button></div>
    <div class="mbd" style="text-align:center;padding:24px">
      ${done?'<div style="font-size:54px;color:var(--green);margin-bottom:8px">✓</div>':'<div class="spin" style="width:46px;height:46px;border:5px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:rot 1s linear infinite;margin:0 auto 16px"></div>'}
      <div style="font-size:15px;color:var(--mut);line-height:1.6">${body}</div>
      ${done?'':'<button class="btn ghost" style="margin-top:18px" onclick="cancelCustomerCheckout()">إلغاء</button>'}</div>`);
  if(!document.getElementById('ccrot')){const st=document.createElement('style');st.id='ccrot';st.textContent='@keyframes rot{to{transform:rotate(360deg)}}';document.head.appendChild(st);}
}
async function pollCustomerCheckout(){
  if(!_cc) return;
  let s; try{ s=await api('/display?tenant='+encodeURIComponent(guestSlug())); }catch(e){ return; }
  const co=s.checkout;
  if(!co || co.sessionId!==_cc.sessionId){ return; }
  if(co.phase==='tip'){ ccModal('📲 بانتظار الضيف','يختار البقشيش على شاشة العميل…'); return; }
  if(co.phase==='await_card' && !_ccCharging){
    _ccCharging=true;
    ccModal('💳 جارٍ تحصيل الدفع',`يُخصم ${money(_cc.baseTotal+(co.tip||0))}${co.tip?` (شامل ${money(co.tip)} بقشيش)`:''}…`);
    try{
      const lines=_cc.lines.map(l=>({name:l.name,price:l.price,qty:l.qty}));
      const intent=await api('/payments/intent',{method:'POST',body:JSON.stringify({lines,tip:co.tip||0})});
      const r=await api('/payments/complete',{method:'POST',body:JSON.stringify({intentId:intent.id,method:'card',lines,tip:co.tip||0,table:tableNo})});
      _ccPayId=r.id;
      await api('/display/checkout/advance',{method:'POST',body:JSON.stringify({sessionId:_cc.sessionId,phase:'approved'})});
      ccModal('✅ تمت الموافقة','الضيف يختار طريقة استلام إيصاله…');
    }catch(e){
      await api('/display/checkout/advance',{method:'POST',body:JSON.stringify({sessionId:_cc.sessionId,phase:'declined'})}).catch(()=>{});
      finishCustomerCheckout(); toast('⚠️ فشل الدفع: '+e.message);
    }
    return;
  }
  if(co.phase==='approved' && co.receipt && !_ccReceiptDone){
    _ccReceiptDone=true;
    try{
      if((co.receipt==='email'||co.receipt==='sms') && co.contact && _ccPayId)
        await api('/receipts/send',{method:'POST',body:JSON.stringify({paymentId:_ccPayId,channel:co.receipt,to:co.contact})});
    }catch(e){}

let _qrLibLoading=null;
function loadQRLib(){
  if(window.QRCode) return Promise.resolve();
  if(_qrLibLoading) return _qrLibLoading;
  _qrLibLoading=new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return _qrLibLoading;
}
async function paintQRs(){
  try{ await loadQRLib(); }catch(e){ toast('⚠️ تعذّر تحميل مولّد QR (يحتاج إنترنت)'); return; }
  document.querySelectorAll('.qrbox').forEach(box=>{
    if(box._done) return; box._done=true;
    new QRCode(box,{text:box.dataset.url,width:140,height:140,correctLevel:QRCode.CorrectLevel.M});
  });
}

function qrImgData(url){

function renderRecipe(){

  else box.innerHTML=_editRecipe.map((r,ri)=>{
    const inv=_invItems.find(i=>i.id===r.invId)||{};

      <select oninput="_editRecipe[${ri}].invId=this.value" style="flex:1;min-width:120px;${ip}">

      <input type="number" step="0.01" min="0" value="${r.qty||0}" title="الكمية لكل عنصر" oninput="_editRecipe[${ri}].qty=+this.value" style="width:80px;${ip}">
      <span style="font-size:11px;color:var(--mut);white-space:nowrap;min-width:54px">${money((inv.cost||0)*(r.qty||0))}</span>

  }).join('')||'<div style="color:var(--mut);font-size:12px;margin-bottom:8px">لا مكوّنات مرتبطة. أضف واحدًا ليُخصم المخزون تلقائيًا مع كل بيع.</div>';

function addRecipeRow(){ if(!_invItems.length){toast('أضف عناصر المخزون أولًا');return;} _editRecipe.push({invId:_invItems[0].id,qty:1}); renderRecipe(); }

function invForm(id){
  const i=id?_invItems.find(x=>x.id===id):{name:'',unit:'unit',qty:0,parLevel:0,cost:0};
  const ip='width:100%;padding:9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt)';
  openModal(`<div class="mhd"><h3>${id?'تعديل':'إضافة'} مكوّن</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbd">

    <div class="row2">
      <div class="fld"><label>الوحدة (قطعة، أونصة، خبز…)</label><input id="iv-unit" value="${i.unit||'unit'}" style="${ip}"></div>
      <div class="fld"><label>المتاح</label><input id="iv-qty" type="number" step="0.01" value="${i.qty||0}" style="${ip}"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>حد إعادة الطلب (تنبيه المخزون المنخفض)</label><input id="iv-par" type="number" step="0.01" value="${i.parLevel||0}" style="${ip}"></div>
      <div class="fld"><label>تكلفة الوحدة ($)</label><input id="iv-cost" type="number" step="0.0001" value="${i.cost||0}" style="${ip}"></div>
    </div>
    <button class="btn primary" style="margin-top:8px" onclick="saveInv('${id||''}')">${id?'حفظ التغييرات':'إضافة مكوّن'}</button></div>`);
}
async function saveInv(id){
  const body={ name:$("#iv-name").value.trim(), unit:$("#iv-unit").value.trim()||'unit',
    qty:$("#iv-qty").value, parLevel:$("#iv-par").value, cost:$("#iv-cost").value };
  if(!body.name){ toast('الاسم مطلوب'); return; }
  try{
    if(id) await api('/inventory/'+id,{method:'PUT',body:JSON.stringify(body)});
    else   await api('/inventory',{method:'POST',body:JSON.stringify(body)});
    closeModal(); render(); toast(id?'تم تحديث المكوّن':'تمت إضافة المكوّن');
  }catch(e){ toast(e.offline?'📴 يحتاج اتصالًا':'⚠️ '+e.message); }
}
async function adjustStock(id,delta){
  try{ await api('/inventory/'+id+'/adjust',{method:'POST',body:JSON.stringify({delta})}); render(); }
  catch(e){ toast(e.offline?'📴 يحتاج اتصالًا':'⚠️ '+e.message); }
}
async function delInv(id){
  const i=_invItems.find(x=>x.id===id);
  if(!confirm('حذف '+(i?i.name:'هذا المكوّن')+'؟ الوصفات التي تشير إليه ستتوقف عن خصمه.'))return;
  try{ await api('/inventory/'+id,{method:'DELETE'}); render(); toast('تم حذف المكوّن'); }
  catch(e){ toast(e.offline?'📴 يحتاج اتصالًا':'⚠️ '+e.message); }
}

let _resvs=[], _resvTab='reservations';
async function reservationsView(){
  _resvs=await api('/reservations').catch(()=>[]);
  const resvs=_resvs.filter(r=>r.kind==='reservation');
  const waits=_resvs.filter(r=>r.kind==='waitlist');
  const activeWait=waits.filter(w=>w.status==='waiting');
  const upcoming=resvs.filter(r=>r.status==='booked');
  const tab=(id,label,n)=>`<button class="chip ${_resvTab===id?'sel':''}" style="padding:8px 16px" onclick="_resvTab='${id}';render()">${label}${n?` <b>${n}</b>`:''}</button>`;
  const statusTag={booked:'<span class="tag blue">محجوز</span>',waiting:'<span class="tag amber">بالانتظار</span>',seated:'<span class="tag green">جالس</span>',cancelled:'<span class="tag red">ملغى</span>',noshow:'<span class="tag red">لم يحضر</span>',done:'<span class="tag">تم</span>'};
  let body;
  if(_resvTab==='reservations'){
    const rows=resvs.map(r=>`<tr style="${['cancelled','noshow','done'].includes(r.status)?'opacity:.5':''}">
        <td style="white-space:nowrap"><b>${new Date(r.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</b><div style="font-size:11px;color:var(--mut)">${new Date(r.time).toLocaleDateString()}</div></td>
        <td><b>${esc(r.name)}</b>${r.notes?`<div style="font-size:11px;color:var(--mut)">${esc(r.notes)}</div>`:''}</td>
        <td style="text-align:center">👥 ${r.partySize}</td>
        <td style="color:var(--mut)">${esc(r.phone||'')}</td>
        <td>${statusTag[r.status]||r.status}${r.tableNumber?` · T${r.tableNumber}`:''}</td>
        <td style="text-align:left;white-space:nowrap">${r.status==='booked'?`<button class="btn green" style="flex:0;padding:6px 10px" onclick="seatResv('${r.id}')">إجلاس</button>
          <button class="chip" onclick="resvStatus('${r.id}','noshow')">لم يحضر</button>
          <button class="chip" onclick="resvStatus('${r.id}','cancelled')">✕</button>`:''}</td></tr>`).join('')
      ||'<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:20px">لا حجوزات. أضف واحدة بالأعلى.</td></tr>';
    body=`<div class="card"><div style="overflow-x:auto"><table><thead><tr><th>الوقت</th><th>الضيف</th><th>العدد</th><th>الهاتف</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  } else {
    const rows=waits.map(w=>{const elapsed=Math.floor((Date.now()-w.createdAt)/60000);
      return `<tr style="${['cancelled','noshow','done','seated'].includes(w.status)?'opacity:.5':''}">
        <td><b>${esc(w.name)}</b>${w.notes?`<div style="font-size:11px;color:var(--mut)">${esc(w.notes)}</div>`:''}</td>
        <td style="text-align:center">👥 ${w.partySize}</td>
        <td style="text-align:center">${w.quotedWait!=null?w.quotedWait+'د متوقّعة':''}</td>
        <td style="text-align:center;color:${elapsed>(w.quotedWait||999)?'#f87171':'var(--mut)'}">ينتظر ${elapsed}د</td>
        <td>${statusTag[w.status]||w.status}${w.tableNumber?` · T${w.tableNumber}`:''}</td>
        <td style="text-align:left;white-space:nowrap">${w.status==='waiting'?`<button class="btn green" style="flex:0;padding:6px 10px" onclick="seatResv('${w.id}')">إجلاس</button>
          <button class="chip" onclick="resvStatus('${w.id}','cancelled')">✕</button>`:''}</td></tr>`;}).join('')
      ||'<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:20px">قائمة الانتظار فارغة.</td></tr>';
    body=`<div class="card"><div style="overflow-x:auto"><table><thead><tr><th>الضيف</th><th>العدد</th><th>الوقت المتوقع</th><th>الانتظار</th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return `<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:100px;text-align:center"><div style="font-size:24px;font-weight:800">${upcoming.length}</div><div style="color:var(--mut);font-size:12px">حجوزات قادمة</div></div>
      <div class="card" style="flex:1;min-width:100px;text-align:center"><div style="font-size:24px;font-weight:800;color:#f5c451">${activeWait.length}</div><div style="color:var(--mut);font-size:12px">في قائمة الانتظار</div></div>
      <div class="card" style="flex:1;min-width:100px;text-align:center"><div style="font-size:24px;font-weight:800;color:#34d399">${_resvs.filter(r=>r.status==='seated').length}</div><div style="color:var(--mut);font-size:12px">جالسون اليوم</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap">${tab('reservations','📅 الحجوزات',upcoming.length)}${tab('waitlist','⏳ قائمة الانتظار',activeWait.length)}</div>
      <button class="btn primary" style="flex:0;padding:10px 18px" onclick="resvForm('${_resvTab==='waitlist'?'waitlist':'reservation'}')">+ ${_resvTab==='waitlist'?'أضف لقائمة الانتظار':'حجز جديد'}</button></div>
    ${body}`;
}
function resvForm(kind){
  const ip='width:100%;padding:9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt)';
  const isW=kind==='waitlist';
  const now=new Date(Date.now()+3600000); const dt=now.toISOString().slice(0,16);
  openModal(`<div class="mhd"><h3>${isW?'⏳ أضف لقائمة الانتظار':'📅 حجز جديد'}</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbd">
    <div class="fld"><label>اسم الضيف</label><input id="rf-name" style="${ip}" autofocus></div>
    <div class="row2"><div class="fld" style="margin:0"><label>عدد الأشخاص</label><input id="rf-party" type="number" min="1" value="2" style="${ip}"></div>
      <div class="fld" style="margin:0"><label>الهاتف</label><input id="rf-phone" style="${ip}"></div></div>
    ${isW?`<div class="fld"><label>وقت الانتظار المتوقع (دقائق)</label><input id="rf-wait" type="number" min="0" value="20" style="${ip}"></div>`
        :`<div class="fld"><label>التاريخ والوقت</label><input id="rf-time" type="datetime-local" value="${dt}" style="${ip}"></div>`}
    <div class="fld"><label>ملاحظات</label><input id="rf-notes" placeholder="تفضيل الجلوس، مناسبة…" style="${ip}"></div>
    <button class="btn green" style="margin-top:6px" onclick="saveResv('${kind}')">${isW?'أضف لقائمة الانتظار':'احجز'}</button></div>`);
}
async function saveResv(kind){
  const body={kind,name:$("#rf-name").value.trim(),partySize:$("#rf-party").value,phone:$("#rf-phone").value.trim(),notes:$("#rf-notes").value.trim()};
  if(!body.name){ toast('اسم الضيف مطلوب'); return; }
  if(kind==='waitlist') body.quotedWait=$("#rf-wait").value;
  else { const t=$("#rf-time").value; if(!t){ toast('اختر وقتًا'); return; } body.time=new Date(t).getTime(); }
  try{ await api('/reservations',{method:'POST',body:JSON.stringify(body)}); closeModal(); render(); toast(kind==='waitlist'?'⏳ أُضيف لقائمة الانتظار':'📅 تم الحجز'); }
  catch(e){ toast('⚠️ '+e.message); }
}
async function seatResv(id){
  const t=prompt('إجلاس على رقم طاولة (اختياري):','');
  if(t===null) return;
  try{ await api('/reservations/'+id+'/seat',{method:'POST',body:JSON.stringify({tableNumber:t?Number(t):null})}); render(); toast('✓ تم إجلاس الضيوف'); }
  catch(e){ toast('⚠️ '+e.message); }
}
async function resvStatus(id,status){
  try{ await api('/reservations/'+id+'/status',{method:'POST',body:JSON.stringify({status})}); render(); toast('تم التحديث'); }
  catch(e){ toast('⚠️ '+e.message); }
}

  const {from,to}=locRange();
  [_locs,_roll]=await Promise.all([
    api('/locations').catch(()=>[]),
    api('/locations/rollup?from='+from+'&to='+to).catch(()=>null),

  const c=(_roll&&_roll.combined)||{netSales:0,orders:0,avgCheck:0,tax:0};

      <div class="card" style="flex:1;min-width:140px"><div style="color:var(--mut);font-size:12px">صافي المبيعات الإجمالي</div><div style="font-size:26px;font-weight:800">${money(c.netSales)}</div><div style="font-size:12px;color:var(--mut)">${rows.length} فرع</div></div>
      <div class="card" style="flex:1;min-width:140px"><div style="color:var(--mut);font-size:12px">إجمالي الطلبات</div><div style="font-size:26px;font-weight:800">${c.orders}</div></div>
      <div class="card" style="flex:1;min-width:140px"><div style="color:var(--mut);font-size:12px">متوسط الفاتورة</div><div style="font-size:26px;font-weight:800">${money(c.avgCheck)}</div></div>
      <div class="card" style="flex:1;min-width:140px"><div style="color:var(--mut);font-size:12px">الضريبة المحصّلة</div><div style="font-size:26px;font-weight:800">${money(c.tax)}</div></div>
    </div>
    <div class="sec-title">المبيعات حسب الفرع</div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>الفرع</th><th></th><th style="text-align:left">صافي المبيعات</th><th style="text-align:left">الطلبات</th><th style="text-align:left">المتوسط</th><th></th></tr></thead>
      <tbody>${rollRows}</tbody></table></div></div>
    <p style="font-size:12px;color:var(--mut);margin-top:12px">يُرتبط كل فرع بأعمال Tavo عبر الـ slug. يسحب المجموع المبيعات الحيّة من كل موقع مرتبط إلى عرض موحّد.</p>`;

/* ---- الخصومات ---- */
let _discs=[];
const DOW_SHORT=['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'];
function discValueLabel(d){ return d.kind==='amount'?('$'+(Number(d.value)||0).toFixed(2)+' خصم'):((Number(d.value)||0)+'% خصم'); }
function discSchedLabel(d){
  if(!d.schedule||!d.schedule.days||!d.schedule.days.length) return '<span style="color:var(--mut)">يدوي</span>';
  const days=d.schedule.days.slice().sort().map(n=>DOW_SHORT[n]).join(' ');
  return `${days} · ${d.schedule.start}–${d.schedule.end}`;
}
async function discountsView(){
  _discs=await api('/discounts').catch(()=>[]);
  const now=new Date();
  const rows=_discs.map(d=>{
    const live=d.active&&d.autoApply&&d.schedule&&discLiveNow(d.schedule,now);
    return `<tr>
      <td><b>${esc(d.name)}</b>${d.reason&&d.reason!==d.name?`<div style="font-size:11px;color:var(--mut)">${esc(d.reason)}</div>`:''}</td>
      <td>${discValueLabel(d)}</td>
      <td style="font-size:13px">${discSchedLabel(d)}</td>
      <td>${d.autoApply?'<span class="tag" style="background:#3a2a5e;color:#c4b5fd">تلقائي</span>':'<span style="color:var(--mut)">—</span>'}${live?' <span class="tag green">● نشط الآن</span>':''}</td>
      <td>${d.active?'<span class="tag green">مفعّل</span>':'<span class="tag" style="color:var(--mut)">معطّل</span>'}</td>
      <td style="text-align:left;white-space:nowrap">
        <button class="chip" onclick="discForm('${d.id}')">تعديل</button>
        <button class="chip" onclick="delDiscount('${d.id}')">✕</button></td></tr>`;
  }).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:20px">لا خصومات بعد.</td></tr>';
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="color:var(--mut);font-size:13px">أنشئ خصومات قابلة لإعادة الاستخدام. أضف جدولًا ليُطبَّق تلقائيًا خلال الساعة السعيدة.</div>
      <button class="btn primary" style="flex:0;padding:10px 18px" onclick="discForm()">+ إضافة خصم</button></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>الاسم</th><th>المبلغ</th><th>الجدول</th><th>تلقائي</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    <p style="font-size:12px;color:var(--mut);margin-top:12px">الخصم الذي له جدول و<b>تطبيق تلقائي</b> مفعّل سيُطبَّق تلقائيًا في نقطة البيع خلال نافذته.</p>`;
}
function discLiveNow(s,now){
  if(!s||!s.days||!s.days.length) return false;
  const day=now.getDay(), cur=now.getHours()*60+now.getMinutes();
  const p=(x,d)=>{const[a,b]=String(x||d).split(':').map(Number);return (a||0)*60+(b||0);};
  const st=p(s.start,'00:00'), en=p(s.end,'23:59');
  if(en>st) return s.days.includes(day)&&cur>=st&&cur<en;
  const prev=(day+6)%7; return (s.days.includes(day)&&cur>=st)||(s.days.includes(prev)&&cur<en);
}
function discForm(id){
  const d=id?_discs.find(x=>x.id===id):null;
  const ip='width:100%;padding:9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt)';
  const sched=d&&d.schedule||null;
  const days=sched&&sched.days||[];
  const dayBtns=DOW_SHORT.map((lab,n)=>`<label style="display:inline-flex;align-items:center;gap:4px;margin-left:8px"><input type="checkbox" class="df-day" value="${n}" ${days.includes(n)?'checked':''}> ${lab}</label>`).join('');
  openModal(`<div class="mhd"><h3>🏷️ ${id?'تعديل':'خصم جديد'}</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbd">
    <div class="fld"><label>الاسم</label><input id="df-name" value="${d?esc(d.name):''}" placeholder="ساعة سعيدة" style="${ip}" autofocus></div>
    <div class="fld" style="display:flex;gap:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:120px"><label>النوع</label><select id="df-kind" style="${ip}" onchange="dfUnit()">
        <option value="percent" ${!d||d.kind==='percent'?'selected':''}>نسبة (%)</option>
        <option value="amount" ${d&&d.kind==='amount'?'selected':''}>مبلغ ($)</option></select></div>
      <div style="flex:1;min-width:120px"><label>القيمة <span id="df-unit" style="color:var(--mut)">(%)</span></label><input id="df-value" type="number" min="0" step="0.01" value="${d?d.value:''}" placeholder="20" style="${ip}"></div>
    </div>
    <div class="fld"><label>وسم الإيصال</label><input id="df-reason" value="${d&&d.reason?esc(d.reason):''}" placeholder="ساعة سعيدة" style="${ip}"></div>
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0 4px;cursor:pointer"><input type="checkbox" id="df-sched" ${sched?'checked':''} onchange="dfSched()"> <b>جدولته (ساعة سعيدة)</b></label>
    <div id="df-schedbox" style="${sched?'':'display:none'};padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px">
      <div style="margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px">${dayBtns}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:100px"><label style="font-size:12px;color:var(--mut)">البداية</label><input id="df-start" type="time" value="${sched?sched.start:'16:00'}" style="${ip}"></div>
        <div style="flex:1;min-width:100px"><label style="font-size:12px;color:var(--mut)">النهاية</label><input id="df-end" type="time" value="${sched?sched.end:'18:00'}" style="${ip}"></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer"><input type="checkbox" id="df-auto" ${!d||d.autoApply?'checked':''}> تطبيق تلقائي في نقطة البيع خلال هذه النافذة</label>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer"><input type="checkbox" id="df-active" ${!d||d.active?'checked':''}> مفعّل</label>
    <button class="btn green" style="margin-top:8px" onclick="saveDiscount('${id||''}')">${id?'حفظ التغييرات':'إضافة الخصم'}</button></div>`);
  dfUnit();
}
function dfUnit(){ const k=$("#df-kind").value; const u=$("#df-unit"); if(u) u.textContent=k==='amount'?'($)':'(%)'; }
function dfSched(){ const on=$("#df-sched").checked; $("#df-schedbox").style.display=on?'':'none'; }
async function saveDiscount(id){
  const name=$("#df-name").value.trim();
  if(!name){ toast('الاسم مطلوب'); return; }
  const kind=$("#df-kind").value;
  const value=Number($("#df-value").value)||0;
  if(value<=0){ toast('أدخل قيمة'); return; }
  if(kind==='percent'&&value>100){ toast('النسبة لا تتجاوز 100'); return; }
  let schedule=null, autoApply=false;
  if($("#df-sched").checked){
    const days=[...document.querySelectorAll('.df-day:checked')].map(c=>Number(c.value));
    if(!days.length){ toast('اختر يومًا واحدًا على الأقل'); return; }
    schedule={days,start:$("#df-start").value||'16:00',end:$("#df-end").value||'18:00'};
    autoApply=$("#df-auto").checked;
  }
  const body={name,kind,value,reason:$("#df-reason").value.trim()||name,schedule,autoApply,active:$("#df-active").checked};
  try{
    if(id) await api('/discounts/'+id,{method:'PUT',body:JSON.stringify(body)});
    else await api('/discounts',{method:'POST',body:JSON.stringify(body)});
    closeModal(); render(); toast('🏷️ تم حفظ الخصم');
  }catch(e){ toast('⚠️ '+e.message); }
}
async function delDiscount(id){
  if(!confirm('حذف هذا الخصم؟')) return;
  try{ await api('/discounts/'+id,{method:'DELETE'}); render(); toast('تم الحذف'); }
  catch(e){ toast('⚠️ '+e.message); }

    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:140px"><div style="color:var(--mut);font-size:12px">صافي المبيعات</div><div style="font-size:24px;font-weight:800">${money(t.netSales)}</div><div style="font-size:12px">مقابل السابق ${arrow(c.salesChangePct)}</div></div>
      <div class="card" style="flex:1;min-width:140px"><div style="color:var(--mut);font-size:12px">الطلبات</div><div style="font-size:24px;font-weight:800">${t.orders}</div><div style="font-size:12px">مقابل السابق ${arrow(c.ordersChangePct)}</div></div>
      <div class="card" style="flex:1;min-width:140px"><div style="color:var(--mut);font-size:12px">متوسط الفاتورة</div><div style="font-size:24px;font-weight:800">${money(t.avgCheck)}</div></div>

        <div style="flex:1;min-width:130px"><label style="font-size:12px;color:var(--mut)">تجميع حسب</label><br>
          <select id="rb-group" style="width:100%;padding:8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt)">
            ${[['employee','الموظف'],['category','التصنيف'],['daypart','فترة اليوم'],['hour','الساعة'],['dow','يوم الأسبوع'],['method','طريقة الدفع'],['day','اليوم']].map(([v,l])=>`<option value="${v}" ${_rbGroup===v?'selected':''}>${l}</option>`).join('')}</select></div>
        <div style="flex:1;min-width:130px"><label style="font-size:12px;color:var(--mut)">القياس</label><br>
          <select id="rb-metric" style="width:100%;padding:8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt)">
            ${[['sales','صافي المبيعات'],['orders','الطلبات'],['avg','متوسط الفاتورة'],['tips','البقشيش']].map(([v,l])=>`<option value="${v}" ${_rbMetric===v?'selected':''}>${l}</option>`).join('')}</select></div>
        <button class="btn primary" style="flex:0;padding:9px 18px;min-width:100px" onclick="runReport()">تشغيل</button>
        <button class="btn ghost" style="flex:0;padding:9px 14px" onclick="exportReport()">⬇ CSV</button>
      </div>
      <div id="rb-out">${_rbRows?reportTable():'<div style="color:var(--mut);font-size:13px">اختر بُعدًا وقياسًا، ثم شغّل.</div>'}</div>
    </div>`;
}
function reportTable(){
  if(!_rbRows||!_rbRows.length) return '<div style="color:var(--mut);font-size:13px">لا صفوف.</div>';
  const money$=_rbMetric==='orders'?(v=>v):(v=>money(v));
  const max=Math.max(1,..._rbRows.map(r=>r.value));
  return `<table>${_rbRows.map(r=>`<tr><td style="padding:5px 0">${esc(r.key)}</td>
    <td style="width:55%"><div style="height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden"><div style="width:${Math.round(r.value/max*100)}%;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7)"></div></div></td>
    <td style="text-align:left;font-weight:600;white-space:nowrap">${money$(r.value)}</td></tr>`).join('')}</table>`;
}
async function runReport(){
  _rbGroup=$("#rb-group").value; _rbMetric=$("#rb-metric").value;
  const {from,to}=anRange();
  try{ const r=await api(`/reports/build?groupBy=${_rbGroup}&metric=${_rbMetric}&from=${from}&to=${to}`); _rbRows=r.rows; document.getElementById('rb-out').innerHTML=reportTable(); }
  catch(e){ toast('⚠️ '+e.message); }
}
function exportReport(){
  if(!_rbRows||!_rbRows.length){ toast('شغّل تقريرًا أولًا'); return; }
  const head=_rbGroup+','+_rbMetric+'\n';
  const body=_rbRows.map(r=>`"${String(r.key).replace(/"/g,'""')}",${r.value}`).join('\n');
  const blob=new Blob([head+body],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='tavo-report-'+_rbGroup+'.csv'; a.click(); URL.revokeObjectURL(url);
  toast('⬇ تم تنزيل CSV');
}
