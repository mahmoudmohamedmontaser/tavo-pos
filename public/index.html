  const schedule=(days.length||start||end)?{days,start:start||null,end:end||null}:null;
  const comboItems=($("#mi-combo-items")?$("#mi-combo-items").value:'').split(',').map(s=>s.trim()).filter(Boolean);
  const body={ name:$("#mi-name").value.trim(), category:$("#mi-cat").value.trim()||'أخرى',
    price:$("#mi-price").value, emoji:$("#mi-emoji").value||'🍽️',
    image:$("#mi-image").value||null, modifierGroups:groups, recipe,
    sku:($("#mi-sku")?$("#mi-sku").value.trim():'')||null, barcode:($("#mi-barcode")?$("#mi-barcode").value.trim():'')||null,
    stock:stockVal===''?null:Number(stockVal), trackStock:document.getElementById('mi-track')?document.getElementById('mi-track').checked:false,
    taxRate:taxVal===''?null:(Number(taxVal)/100), schedule, isCombo:document.getElementById('mi-combo')?document.getElementById('mi-combo').checked:false, comboItems,
    weighted:document.getElementById('mi-weighted')?document.getElementById('mi-weighted').checked:false,
    weightUnit:document.getElementById('mi-weight-unit')?document.getElementById('mi-weight-unit').value:'lb',
    active:document.getElementById('mi-active').checked };
  if(!body.name||body.price===''){ toast('الاسم والسعر مطلوبان'); return; }
  try{
    if(id) await api('/menu/'+id,{method:'PUT',body:JSON.stringify(body)});
    else   await api('/menu',{method:'POST',body:JSON.stringify(body)});
    await loadMenu(); closeModal(); render(); toast(id?'تم تحديث العنصر':'تمت إضافة العنصر');
  }catch(e){ toast(e.offline?'📴 تعديلات القائمة تحتاج اتصالًا':'⚠️ '+e.message); }
}
async function toggleAvail(id){
  const it=_menuItems.find(i=>i.id===id); if(!it)return;
  try{ await api('/menu/'+id,{method:'PUT',body:JSON.stringify({active:it.active===false})});
    await loadMenu(); render(); toast(it.active===false?'عاد إلى القائمة':'مُعلَّم كمنفد (86)'); }
  catch(e){ toast(e.offline?'📴 يحتاج اتصالًا':'⚠️ '+e.message); }
}
async function moveItem(id,dir){
  const it=_menuItems.find(i=>i.id===id); if(!it)return;
  const group=_menuItems.filter(i=>i.category===it.category);
  const idx=group.findIndex(i=>i.id===id); const j=idx+dir;
  if(j<0||j>=group.length)return;
  [group[idx],group[j]]=[group[j],group[idx]];
  const order=[]; const seen=new Set(group.map(g=>g.id));
  _menuItems.forEach(i=>{ if(!seen.has(i.id)) order.push(i.id); });
  group.forEach(g=>order.push(g.id));
  try{ await api('/menu/reorder',{method:'POST',body:JSON.stringify({order})}); await loadMenu(); render(); }
  catch(e){ toast(e.offline?'📴 يحتاج اتصالًا':'⚠️ '+e.message); }
}
async function delItem(id){
  if(!confirm('حذف هذا العنصر نهائيًا؟'))return;
  try{ await api('/menu/'+id,{method:'DELETE'}); await loadMenu(); render(); toast('تم حذف العنصر'); }
  catch(e){ toast(e.offline?'📴 يحتاج اتصالًا':'⚠️ '+e.message); }
}

/* ---- تسجيل الدخول ---- */
let pinBuf='';
function loginScreen(){
  $("#app").style.display='none';
  let scr=document.getElementById('loginScreen');
  if(!scr){scr=document.createElement('div');scr.id='loginScreen';document.body.appendChild(scr);}
  scr.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200;overflow-y:auto;padding:16px';
  const keys=[1,2,3,4,5,6,7,8,9,'C',0,'⏎'];
  scr.innerHTML=`<div style="text-align:center;width:300px;max-width:100%">
    <div class="logo" style="margin:0 auto 14px;width:60px;height:60px;font-size:26px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:800">T</div>
    <h2 style="margin:0 0 4px">Tavo POS</h2>
    <p style="color:var(--mut);font-size:13px;margin:0 0 18px">أدخل رقمك السري لتسجيل الحضور</p>
    <div id="pinDots" style="display:flex;gap:12px;justify-content:center;margin-bottom:6px;height:20px"></div>
    <div id="pinErr" style="color:var(--red);font-size:12px;min-height:16px;margin-bottom:10px"></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      ${keys.map(k=>`<button onclick="pinKey('${k}')" style="padding:18px;font-size:20px;font-weight:700;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);color:var(--txt)">${k}</button>`).join("")}
    </div>
    <p style="color:var(--mut);font-size:11px;margin-top:18px;line-height:1.6">أرقام تجريبية · مدير <b>1234</b> · نادل <b>1111</b> · مطبخ <b>3333</b></p>
  </div>`;
  drawPin();
}
function drawPin(){const d=document.getElementById('pinDots');if(d)d.innerHTML=pinBuf.split('').map(()=>'<span style="width:14px;height:14px;border-radius:50%;background:var(--brand);display:inline-block"></span>').join('')||'<span style="color:var(--mut);font-size:12px">····</span>'}
function pinKey(k){
  if(k==='C'){pinBuf='';drawPin();return}
  if(k==='⏎'){submitPin();return}
  if(pinBuf.length<6){pinBuf+=k;drawPin();if(pinBuf.length>=4){}}
}
const TENANT_SLUG=new URLSearchParams(location.search).get('tenant')||'default';
async function submitPin(){
  try{
    const res=await api('/auth/login',{method:'POST',body:JSON.stringify({pin:pinBuf,tenant:TENANT_SLUG})});
    TOKEN=res.token;ME=res.user;localStorage.setItem('pp_token',TOKEN);
    pinBuf='';const scr=document.getElementById('loginScreen');if(scr)scr.remove();
    $("#app").style.display='grid';
    await startApp();
  }catch(e){pinBuf='';drawPin();const er=document.getElementById('pinErr');if(er)er.textContent=e.message}
}
function logout(silent){TOKEN=null;ME=null;localStorage.removeItem('pp_token');route='pos';if(!silent)toast('تم تسجيل الخروج');loginScreen();}

/* ---- الإقلاع ---- */
function tickClock(){$("#clock").textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
async function loadMenu(){MENU=await api('/menu').catch(()=>cacheGet('/menu')||[]);CATS=[...new Set(MENU.map(m=>m.category))];if(!activeCat)activeCat=CATS[0]||''}
async function startApp(){
  try{CFG=await api('/config')}catch{}
  try{LOYALTY=await api('/loyalty/config')}catch{}
  try{ const t=await api('/tenant'); TENANT_MODE=(t&&t.mode)||(ME&&ME.tenantMode)||'restaurant'; TENANT_SETTINGS=(t&&t.settings)||{}; }catch{ TENANT_MODE=(ME&&ME.tenantMode)||'restaurant'; }
  const GW={stripe:'💳 Stripe',fiserv:'💳 Fiserv',tsys:'💳 TSYS',mock:'🧪 دفع محاكاة'};
  $("#modebadge").textContent=(GW[CFG.paymentMode]||('💳 '+CFG.paymentMode))+(ME?` · ${ME.name} (${ME.role})`:'');
  if(!((ME&&ME.routes)||[]).includes(route)) route=(ME.routes&&ME.routes[0])||'pos';
  await loadMenu();tickClock();
  if(!window._clockIv) window._clockIv=setInterval(()=>{tickClock();if(route==='kds'||route==='online')render()},30000);
  updateConn();
  if(OUTBOX.length) flushOutbox();
  renderNav();render();
}
async function boot(){
  if(!TOKEN){loginScreen();return}
  try{ ME=await api('/auth/me'); await startApp(); }
  catch{ logout(true); }
}
boot();
